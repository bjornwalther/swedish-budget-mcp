[project]
name = "swedish-budget-mcp"
version = "0.1.0"
description = "MCP server for the Swedish national budget (statsbudgeten)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Björn Walther", email = "bjorn.walther@wetail.io"}]
keywords = ["mcp", "sweden", "budget", "statsbudget", "scb", "ekonomi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "fastmcp>=2.0.0,<5",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5.0",
]

[project.scripts]
swedish-budget-mcp = "swedish_budget_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit live external APIs (SCB, Statskontoret)",
]
